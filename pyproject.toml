[project]
name = "finrag"
version = "0.1.0"
description = "RAG over financial reports with source citations and an evaluation suite"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F: errores básicos, I: orden de imports, UP: sintaxis moderna, B: bugs comunes
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
