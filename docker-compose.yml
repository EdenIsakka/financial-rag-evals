services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: finrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finrag}
      POSTGRES_DB: finrag
    ports:
      - "127.0.0.1:5433:5432" # 5433 en tu PC (5432 lo usa otro proyecto); solo accesible localmente
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finrag"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
